name: CROUS Caen watcher
# Runs one check every ~5 minutes on GitHub's servers (free on a PUBLIC repo),
# so alerts keep coming even when your laptop is off.
# Setup: repo Settings > Secrets and variables > Actions > New secret NTFY_TOPIC
on:
  # Main triggers come from cron-job.org (1 min weekdays 8h-20h, 10 min otherwise).
  # This GitHub schedule is only a slow backup in case cron-job.org stops.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crous-caen
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ref: main = start from the latest saved state, not the (possibly stale)
      # commit that was current when this run was queued.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: One check
        env:
          RUN_ONCE: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESIDENCE_FILTER: ${{ vars.RESIDENCE_FILTER }}
          MAX_RENT_EUR: ${{ vars.MAX_RENT_EUR || '0' }}
          # Pending request (Lébisey studio 1406, sent 04/11). Set to 0 when it ends.
          CURRENT_RENT_EUR: ${{ vars.CURRENT_RENT_EUR || '467.32' }}
          CURRENT_DIST_KM: "2.0"
          CURRENT_LABEL: "ton studio Lébisey"
        run: python crous_caen_watch.py
      - name: Save state (so the next run knows what was already seen)
        run: |
          git config user.name "crous-bot"
          git config user.email "crous-bot@users.noreply.github.com"
          git add crous_caen_state.json || true
          git add caen_listings.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "state"
          # If another run saved in the meantime, replay ours on top (ours wins).
          for i in 1 2 3; do
            git push -q && exit 0
            git fetch -q origin main
            git rebase -q -X theirs origin/main || { git rebase --abort; git reset -q --soft origin/main; git commit -q -m "state"; }
          done
          echo "::warning::state not saved after 3 tries (next run will redo it)"
